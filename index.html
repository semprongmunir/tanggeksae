
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Watch the featured video.">
<meta property="og:title" content="Watch the Featured Video">
<meta property="og:description" content="Open the page to view the video.">
<meta name="theme-color" content="#120808">
<title>Watch the Featured Video</title>
<style>
:root{--red:#f22b35;--dark:#120808;--muted:#cbbaba}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at top,#3b1014 0%,#170b0d 45%,#080808 100%);font-family:Arial,Helvetica,sans-serif;color:#fff}
.wrap{width:min(100%,680px);text-align:center}
h1{font-size:clamp(25px,5vw,40px);line-height:1.15;margin-bottom:12px}
.sub{color:var(--muted);font-size:15px;line-height:1.6;margin-bottom:24px}
.preview{position:relative;display:block;width:100%;aspect-ratio:16/9;overflow:hidden;border:1px solid #ff6b70;border-radius:18px;background:#211414;box-shadow:0 0 22px #f22b3544,0 12px 35px #0008}
.preview img{display:block;width:100%;height:100%;object-fit:cover}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#0002}
.play{width:76px;height:76px;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;background:#e71925eF;box-shadow:0 0 24px #ff283d88;transition:transform .2s}
.play:after{content:"";margin-left:6px;border-top:14px solid transparent;border-bottom:14px solid transparent;border-left:22px solid #fff}
.preview:hover .play{transform:scale(1.08)}
.tag{position:absolute;top:12px;left:12px;padding:7px 10px;border-radius:6px;background:#171010d9;font-size:12px;font-weight:700;letter-spacing:1px}
.caption{margin:22px 0;font-size:clamp(17px,3vw,22px);font-weight:700}
.cta{position:relative;isolation:isolate;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:70px;padding:16px 18px;border:1px solid #ff8589;border-radius:14px;background:linear-gradient(180deg,#ff414a 0%,#e51d29 55%,#a70e18 100%);color:#fff;text-decoration:none;font-size:clamp(18px,4vw,27px);font-weight:900;letter-spacing:.5px;box-shadow:0 6px 0 #650b11,0 12px 30px #f22b3538;transition:transform .2s,box-shadow .2s}
.cta:before{content:"";position:absolute;z-index:-1;top:-40%;bottom:-40%;left:-80%;width:45%;transform:skewX(-20deg);background:linear-gradient(90deg,transparent,#ffffff55,transparent);animation:shine 3.5s infinite}
.cta:hover{transform:translateY(-3px);box-shadow:0 9px 0 #650b11,0 15px 35px #f22b3555}
.cta:active{transform:translateY(3px);box-shadow:0 2px 0 #650b11}
.cta:focus-visible,.preview:focus-visible{outline:3px solid #fff;outline-offset:4px}
.smallplay{width:0;height:0;border-top:9px solid transparent;border-bottom:9px solid transparent;border-left:14px solid #fff}
.arrow{font-size:24px}
.note{margin-top:22px;color:#cbbaba;font-size:12px;line-height:1.7}
@keyframes shine{0%,60%{left:-80%}100%{left:140%}}
@media(max-width:480px){.play{width:60px;height:60px}.play:after{border-top-width:11px;border-bottom-width:11px;border-left-width:18px}.cta{min-height:62px;padding:14px 10px;gap:9px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <h1>Watch the Featured Video</h1>
  <p class="sub">Tap below to view the video and its details.</p>

  <a class="preview" href="https://t.co/h4zemwCH2w" aria-label="Open featured video">
    <img src="https://cdn.aceimg.com/ei9lMnzlx.jpg" alt="Featured video preview">
    <span class="tag">FEATURED VIDEO</span>
    <span class="overlay" aria-hidden="true"><span class="play"></span></span>
  </a>

  <p class="caption">Curious to see what's in the video?</p>

  <a class="cta" href="https://t.co/h4zemwCH2w" target="_blank" rel="noopener noreferrer">
    <span class="smallplay" aria-hidden="true"></span>
    <span>WATCH FULL VIDEO</span>
    <span class="arrow" aria-hidden="true">›</span>
  </a>

  <p class="note">Please make sure the destination matches the preview and follows the platform's content rules.</p>
</main>
</body>
</html>
